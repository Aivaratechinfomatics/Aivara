name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Lint
        run: |
          python -m ruff check .

      - name: Run Ruff Format Check
        run: |
          python -m ruff format --check .

      - name: Run Mypy Type Check
        run: |
          python -m mypy config.py analytics/ ingestion/ export/ insight/

      - name: Run Security Scan (Bandit)
        run: |
          python -m bandit -r config.py analytics/ ingestion/ export/ insight/ -ll

      - name: Run Dependency Audit (pip-audit)
        run: |
          python -m pip_audit || true

      - name: Run Pytest with Coverage
        run: |
          python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
